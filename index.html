
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0c0f">
<title>VEXA — Valoblox Competitive</title>
  <style>
:root{--bg:#090a0c;--panel:#141518;--panel2:#1b1d21;--line:#2b2d32;--text:#f5f6f8;--muted:#9ca3af;--red:#ff5a1f;--cyan:#ff9a5e;--green:#4ade80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:10px}
button:hover{border-color:var(--red)}
button.primary{background:var(--red);border-color:var(--red);color:#fff;font-weight:750}
button.ghost{background:transparent}
.app{max-width:1180px;margin:auto;padding:0 16px 90px}
.top{height:68px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#0b0c0fee;backdrop-filter:blur(12px);z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:2px;font-size:20px}
.logo{width:34px;height:34px;border:2px solid var(--red);clip-path:polygon(50% 0,100% 25%,83% 78%,50% 100%,17% 78%,0 25%);display:grid;place-items:center;color:var(--red);font-weight:900}
.spacer{flex:1}.coin{font-weight:800;color:var(--cyan)}
.iconbtn{position:relative}.dot{position:absolute;right:-5px;top:-5px;border-radius:99px;background:var(--red);font-size:10px;min-width:17px;padding:2px 4px}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;padding-top:22px}
.side{align-self:start;position:sticky;top:86px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px}
.nav{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin:3px 0;background:transparent;border-color:transparent;color:var(--muted)}
.nav.active{background:#2a171b;color:#fff;border-color:#4b252a}
.nav b{color:var(--red);width:20px}.main{min-width:0}
.hero{background:linear-gradient(120deg,#1b171b,#111319 65%,#15191d);border:1px solid #3a252b;border-radius:18px;padding:24px;position:relative;overflow:hidden}
.eyebrow{color:var(--red);font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
.hero h1{font-size:clamp(28px,5vw,44px);line-height:1.05;margin:10px 0}
.hero p,.muted{color:var(--muted)}.hero p{max-width:540px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.stat,.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}
.stat small{color:var(--muted);display:block}.stat strong{font-size:22px;display:block;margin-top:5px}
.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:25px 0 12px}
.sectionhead h2{font-size:20px;margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card h3{margin:8px 0 5px}.card p{color:var(--muted);margin:0 0 12px;font-size:13px}
.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:4px 9px;font-size:11px;color:var(--muted)}
.pill.red{border-color:#673037;background:#2a171b;color:#ffb5b5}
.pill.cyan{color:var(--cyan);border-color:#26515a}
.rank-ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.rank-step{position:relative;padding:13px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(145deg,#17191e,#111317);min-height:106px}.rank-step.current{border-color:#a44b29;background:linear-gradient(145deg,#2a180f,#171311);box-shadow:inset 0 0 24px #ff5a1f12}.rank-step .rank-num{display:grid;place-items:center;width:27px;height:29px;clip-path:polygon(50% 0,100% 24%,83% 77%,50% 100%,17% 77%,0 24%);background:#343840;color:#fff;font-size:10px;font-weight:900}.rank-step.current .rank-num{background:var(--red)}.rank-step h3{margin:7px 0 2px;font-size:13px}.rank-step p{margin:0;color:var(--muted);font-size:10px}.rank-step .small{position:absolute;top:14px;right:9px;color:#ff9a5e;font-size:8px;font-weight:900;letter-spacing:.6px}
.rankicon{width:62px;height:72px;display:grid;place-items:center;clip-path:polygon(50% 0,95% 20%,82% 77%,50% 100%,18% 77%,5% 20%);background:linear-gradient(145deg,var(--rank,#9ca3af) 0 48%,#333741 49%);color:#fff;font-weight:900;font-size:22px}
.rankrow{display:flex;align-items:center;gap:12px}.rankrow .rankicon{flex-shrink:0}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select,input,select{background:#0e1014;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;max-width:100%}
.filters input{flex:1;min-width:130px}
.item-art{height:90px;border-radius:10px;background:linear-gradient(135deg,#252a32,#101115);display:grid;place-items:center;font-size:25px;border:1px solid var(--line);text-align:center}
.price{font-weight:850;color:var(--cyan)}.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.bar{height:7px;border-radius:99px;background:#2b2f38;overflow:hidden;margin:10px 0}
.bar span{display:block;height:100%;background:var(--red)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th,.table td{text-align:left;border-bottom:1px solid var(--line);padding:11px 7px}
.table th{color:var(--muted);font-weight:600}
.hide{display:none!important}
.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#20242b;border:1px solid var(--line);padding:12px 16px;border-radius:12px;z-index:20;box-shadow:0 12px 40px #0008}
.mobilebar{display:none}.small{font-size:12px;color:var(--muted)}
.balance{font-size:28px;font-weight:900;color:var(--cyan)}
.notification{padding:12px;border-bottom:1px solid var(--line)}
.notification:last-child{border:0}
@media(max-width:760px){.rank-ladder{grid-template-columns:repeat(2,minmax(0,1fr))}.rank-step{min-height:94px}
.layout{display:block}.side{display:none}.top{height:60px}.top .brand{font-size:17px}.top .toplabel{display:none}
.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr 1fr}
.hero{padding:20px}.mobilebar{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#101115f5;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:10;backdrop-filter:blur(10px)}
.mobilebar button{border:0;background:transparent;padding:7px 5px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted)}
.mobilebar button.active{color:var(--red)}.mobilebar span{font-size:17px}
.app{padding:0 12px 90px}.table{font-size:11px}.table th,.table td{padding:9px 4px}
.stat strong{font-size:20px}.sectionhead{margin-top:20px}
}
@media(max-width:390px){.grid{grid-template-columns:1fr}.top .coinlabel{display:none}.hero h1{font-size:29px}}
    
/* Pantalla de acceso */

  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;

  background: #0b0c0f;

#vexaLogin.hide {
  display: none !important;

.vexa-login-card {
  width: 100%;

.vexa-login-card h1 {
  letter-spacing: 5px;

  width: 100%;

  color: white;
  font-weight: 800;

#welcomeBonus { position:fixed; inset:0; z-index:10000; display:grid; place-items:center; padding:20px; background:#050607d9; backdrop-filter:blur(8px); }
#welcomeBonus.hide { display:none!important; }
.welcome-card { width:min(420px,100%); padding:28px; text-align:center; border:1px solid #573725; border-radius:18px; background:linear-gradient(145deg,#1c1714,#111216); box-shadow:0 24px 90px #000b,0 0 60px #ff5a1f20; }
.welcome-card .gift { font-size:38px; color:#ff8a50; }
.welcome-card h2 { margin:10px 0 6px; font-size:25px; }
.welcome-card p { color:#a9adb5; }
.welcome-card strong { color:#ff9a5e; }
#welcomeBonusClose { min-width:150px; margin-top:8px; background:#ff5a1f; border-color:#ff5a1f; font-weight:800; }
#discordStatus {
  color: #9ca3af;
  overflow-wrap: anywhere;
  font-size: 13px;
  margin-top: 15px;
}

</style>
</head>
<body><div id="vexaLogin">
  <div class="vexa-login-card">
    <h1>VE<span>X</span>A</h1>
    <p>VALOBLOX COMPETITIVE</p>
    <p>Inicia sesión con Discord para entrar en VEXA.</p>
    <button id="discordLogin">🎮 INICIAR SESIÓN CON DISCORD</button>
    <div id="discordStatus"></div>
  </div>
</div>
<div id="welcomeBonus" class="hide" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle"><div class="welcome-card"><div class="gift">✦</div><div class="eyebrow">REGALO DE BIENVENIDA</div><h2 id="welcomeTitle">¡Enhorabuena!</h2><p>Has conseguido <strong>100 VC</strong> por iniciar sesión en VEXA con Discord.</p><button id="welcomeBonusClose">Continuar</button></div></div>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo">V</div>VEXA</div>
  <span class="toplabel muted">VALOBLOX COMPETITIVE</span>
  <div class="spacer"></div>
  <button class="ghost" id="langBtn" title="Change language">EN / ES</button>
  <button class="ghost iconbtn" id="bellBtn" aria-label="Notifications">♧<span class="dot" id="notifCount">3</span></button>
  <div class="coin"><span id="topCoins">100</span> <span class="coinlabel">VC</span></div>
  <button id="profileTop">PERFIL</button>
  <button id="logoutBtn" class="ghost">CERRAR SESIÓN</button>
</header>

<div class="layout">
<aside class="side" id="sideNav">
  <button class="nav active" data-page="home"><b>⌂</b>Inicio</button>
  <button class="nav" data-page="customs"><b>⚔</b>Partidas</button>
  <button class="nav" data-page="friends"><b>♧</b>Amigos</button>
  <button class="nav" data-page="ranks"><b>◇</b>Rangos</button>
  <button class="nav" data-page="tournaments"><b>♜</b>Torneos</button>
  <button class="nav" data-page="store"><b>◈</b>Tienda</button>
  <button class="nav" data-page="inventory"><b>▣</b>Inventario</button>
  <button class="nav" data-page="missions"><b>✦</b>Misiones</button>
  <button class="nav" data-page="teams"><b>♟</b>Equipos</button>
  <button class="nav" data-page="leaderboard"><b>↗</b>Clasificación</button>
  <button class="nav" data-page="notifications"><b>♧</b>Avisos</button>
  <button class="nav" data-page="profile"><b>◎</b>Perfil</button>
  <button class="nav" data-page="settings"><b>⚙</b>Ajustes</button>
  
</aside>
<main class="main" id="main"></main>
</div>
</div>

<nav class="mobilebar">
<button data-page="home" class="active"><span>⌂</span>Home</button>
<button data-page="customs"><span>⚔</span>Customs</button>
<button data-page="friends"><span>♧</span>Friends</button>
<button data-page="tournaments"><span>♜</span>Tournaments</button>
<button data-page="store"><span>◈</span>Store</button>
<button data-page="profile"><span>◎</span>Profile</button>
</nav>
<div id="toast" class="toast hide"></div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const ranks=[
["I","Hierro",0,99,"#777b84",100],
["II","Veterano",100,199,"#d9e2f3",100],
["III","Bronce",200,349,"#bd7958",150],
["IV","Plata",350,599,"#c8d5e9",250],
["V","Oro",600,849,"#f4c64d",250],
["VI","Esmeralda",850,1199,"#19b58b",350],
["VII","Diamante",1200,1599,"#16a8ed",400],
["VIII","Élite",1600,1999,"#a54bea",400],
["IX","Maestro",2000,2499,"#a32b53",500],
["X","EVO",2500,Infinity,"#ff1745",null]
];

const cosmetics=[
{id:"frame-red-outline",name:"Red Outline",cat:"Frames",rarity:"Common",price:100,art:"▣"},
{id:"frame-shadow-ring",name:"Shadow Ring",cat:"Frames",rarity:"Rare",price:250,art:"◉"},
{id:"frame-vexa-core",name:"VEXA Core",cat:"Frames",rarity:"Epic",price:400,art:"◇"},
{id:"frame-blood-edge",name:"Blood Edge",cat:"Frames",rarity:"Legendary",price:650,art:"✧"},
{id:"frame-ascend",name:"Ascend",cat:"Frames",rarity:"Exclusive",price:900,art:"⬡"},
{id:"banner-vexa-stripe",name:"VEXA Stripe",cat:"Banners",rarity:"Common",price:100,art:"▰"},
{id:"banner-crimson-line",name:"Crimson Line",cat:"Banners",rarity:"Rare",price:250,art:"▰"},
{id:"banner-black-phantom",name:"Black Phantom",cat:"Banners",rarity:"Epic",price:400,art:"◈"},
{id:"banner-red-horizon",name:"Red Horizon",cat:"Banners",rarity:"Legendary",price:650,art:"◉"},
{id:"banner-vexa-elite",name:"VEXA Elite",cat:"Banners",rarity:"Exclusive",price:900,art:"V"},
{id:"title-novato",name:"Novato",cat:"Titles",rarity:"Common",price:100,art:"NOVATO"},
{id:"title-clutch",name:"Clutch",cat:"Titles",rarity:"Rare",price:250,art:"CLUTCH"},
{id:"title-ace-hunter",name:"Ace Hunter",cat:"Titles",rarity:"Epic",price:400,art:"ACE HUNTER"},
{id:"title-leyenda",name:"Leyenda",cat:"Titles",rarity:"Legendary",price:650,art:"LEYENDA"},
{id:"title-untouchable",name:"Untouchable",cat:"Titles",rarity:"Exclusive",price:900,art:"UNTOUCHABLE"}
];

const defaults={
coins:0,elo:0,username:"VEXA Player",owned:[],equipped:{},missionsClaimed:[],
notifications:[],
teams:[],customs:[],
friends:[],
settings:{lang:"en",history:true,online:true,notifications:{tournaments:true,invites:true,vc:true}},
wins:0,losses:0,matchHistory:[]
};

let state={...defaults,settings:{...defaults.settings,notifications:{...defaults.settings.notifications}}};

let page="home";
let storeFilter={cat:"All",rarity:"All",sort:"Featured"};
let inventoryTab="Frames",missionTab="Daily";

function save(){
 localStorage.setItem("vexa-demo-state",JSON.stringify(state));
 $("#topCoins").textContent=state.coins;
 $("#notifCount").textContent=state.notifications.filter(n=>!n.read).length;
 $("#notifCount").classList.toggle("hide",!state.notifications.some(n=>!n.read));
}
function toast(t){
 let el=$("#toast");el.textContent=t;el.classList.remove("hide");
 setTimeout(()=>el.classList.add("hide"),2200);
}
function nav(p){
 page=p;
 $$("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===p));
 render();
}
function title(t,sub=""){
 return `<div class="sectionhead"><div><h2>${t}</h2>${sub?`<div class="small">${sub}</div>`:""}</div></div>`;
}
function card(t,desc,tag=""){
 return `<div class="card">${tag?`<span class="pill red">${tag}</span>`:""}<h3>${t}</h3><p>${desc}</p></div>`;
}
function getRank(){
 let r=ranks[0];
 for(const x of ranks)if(state.elo>=x[2])r=x;
 return r;
}
function rankCard(r){
 return `<div class="rankrow">
 <div class="rankicon" style="--rank:${r[4]}">${r[0]==="X"?"◇":"◆"}</div>
 <div><span class="pill">RANK ${r[0]}</span><h3>${r[1]}</h3>
 <p>${r[2]}–${r[3]===Infinity?"∞":r[3]} ELO</p>
 ${r[5]===null?"<p>Rango final</p>":`<p>Ascenso siguiente: ${r[5]} ELO</p>`}
 </div></div>`;
}

function home(){
 let r=getRank(),index=ranks.indexOf(getRank()),next=ranks[index+1];
 let progress=next?Math.max(0,Math.min(100,(state.elo-r[2])/(next[2]-r[2])*100)):100;
 return `<section class="hero">
 <div class="eyebrow">VALOBLOX COMPETITIVE</div>
 <h1>COMPITE.<br><span style="color:var(--red)">SUBE DE RANGO.</span><br>EVOLUCIONA.</h1>
 <p>Gana ELO, supera a tus rivales y alcanza EVO.</p>
 <div class="row"><button class="primary" onclick="nav('customs')">Ver partidas</button><button onclick="nav('store')">Ir a la tienda</button><button class="ghost" onclick="nav('profile')">Mi perfil</button></div>
 </section>
 <div class="stats">
 <div class="stat"><small>ELO actual</small><strong>${state.elo}</strong></div>
 <div class="stat"><small>Rango</small><strong>${r[1]}</strong></div>
 <div class="stat"><small>Monedas VEXA</small><strong style="color:var(--cyan)">${state.coins} VC</strong></div>
 <div class="stat"><small>Porcentaje de victorias</small><strong>${state.wins+state.losses?Math.round(state.wins/(state.wins+state.losses)*100):0}%</strong></div>
 </div>
 ${title("Tu camino hasta EVO","Gana partidas para sumar ELO y subir de rango.")}
 <div class="rank-ladder">${ranks.map((x,i)=>`<article class="rank-step ${i===index?"current":""}"><span class="rank-num">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}–${x[3]===Infinity?"∞":x[3]} ELO</p>${i===index?'<span class="small">TU RANGO</span>':""}</article>`).join("")}</div>
 <div class="panel" style="margin-top:14px"><div class="row"><strong>Progreso hacia ${next?next[1]:"el rango máximo"}</strong><span class="spacer"></span><span class="small">${state.elo} ELO${next?" · "+Math.max(0,next[2]-state.elo)+" para ascender":""}</span></div><div class="bar"><span style="width:${progress}%"></span></div></div>`;
}

function customs(){
 let list=state.customs;
 return `${title("Customs","Only supported formats: 1v1 · 2v2 · 5v5")}
 <div class="panel"><h3>Create a custom</h3>
 <div class="filters">
 <select id="newMode"><option>1v1</option><option>2v2</option><option>5v5</option></select>
 <select id="newPlayers"><option value="open">Open slots — anyone can join</option><option value="friends">Friends only</option></select>
 <button class="primary" onclick="createCustom()">Create custom</button>
 </div>
 <p class="small">No map or custom-name selection. Choose only the format and who can join. Demo only: no real game room is created.</p></div>
 ${title("Find a custom")}
 <div class="filters"><select id="customFilter" onchange="filterCustoms()"><option>All formats</option><option>1v1</option><option>2v2</option><option>5v5</option></select></div>
 <div class="grid" id="customList">${customCards(list)}</div>`;
}
function customCards(list){
 if(!list.length)return `<div class="panel empty">No customs available yet. Create the first one.</div>`;
 return list.map((c,i)=>`<div class="card"><span class="pill red">${c.mode}</span>
 <h3>Custom by ${esc(c.owner||"Player")}</h3>
 <p>${c.audience==="friends"?"Friends only":"Open to players"}</p>
 <div class="row"><button onclick="joinCustom(${i})">Join</button><button class="ghost" onclick="copyCode('${c.code}')">Code: ${c.code}</button></div>
 </div>`).join("");
}
function createCustom(){
 let mode=$("#newMode").value,audience=$("#newPlayers").value;
 state.customs.unshift({mode,owner:"You",audience,private:audience==="friends",code:Math.random().toString(36).slice(2,7).toUpperCase()});
 save();render();toast("Custom created in this browser demo.");
}
function filterCustoms(){
 let f=$("#customFilter").value;
 let list=state.customs.filter(c=>(f==="All formats"||c.mode===f));
 $("#customList").innerHTML=customCards(list);
}
function joinCustom(i){toast("Demo: request to join this custom.");}
function copyCode(code){
 if(navigator.clipboard)navigator.clipboard.writeText(code).then(()=>toast("Code copied")).catch(()=>toast("Code: "+code));
 else toast("Code: "+code);
}

function ranksPage(){
 return `${title("Ranks & ELO","Official VEXA thresholds · 10 ranks · no divisions")}
 <div class="panel"><div class="row">${rankCard(getRank())}
 <div class="spacer"></div><div><div class="small">YOUR ELO</div><div class="balance" style="color:var(--text)">${state.elo}</div></div></div>
 <p class="small">Official rank names, ELO ranges and promotion costs follow your reference image.</p></div>
 ${title("All ranks")}
 <div class="grid">${ranks.map(r=>`<div class="card">${rankCard(r)}</div>`).join("")}</div>
 <div class="panel"><h3>Promotion costs</h3>
 <p>Hierro → Veterano: 100 ELO</p><p>Veterano → Bronce: 100 ELO</p><p>Bronce → Plata: 150 ELO</p>
 <p>Plata → Oro: 250 ELO</p><p>Oro → Esmeralda: 250 ELO</p><p>Esmeralda → Diamante: 350 ELO</p>
 <p>Diamante → Élite: 400 ELO</p><p>Élite → Maestro: 400 ELO</p><p>Maestro → EVO: 500 ELO</p>
 <p class="small">Confirmed wins: +20 ELO. Confirmed losses: −20 ELO. This prototype cannot validate real matches without a backend.</p>
 </div>`;
}

function tournaments(){
 return `${title("Tournaments","Compete for VEXA Coins")}
 <div class="panel"><div class="row"><span class="pill red">UPCOMING</span><span class="pill">Single elimination</span></div>
 <h3>VEXA Open — 2v2</h3><p>Community tournament · Bracket and schedule are illustrative.</p>
 <div class="stats"><div class="stat"><small>Format</small><strong>2v2</strong></div><div class="stat"><small>Teams</small><strong>16</strong></div><div class="stat"><small>Prize pool</small><strong>VC</strong></div><div class="stat"><small>Entry</small><strong>Free</strong></div></div>
 <button class="primary" onclick="toast('Tournament signup is a demo only.')">Sign up</button></div>
 ${title("Tournament rules")}
 <div class="grid">${card("Single elimination","Lose a match and you leave the bracket.")}${card("Captain confirmation","Captains confirm results; disputes need admin review.")}</div>`;
}

function store(){
 let list=cosmetics.filter(x=>(storeFilter.cat==="All"||x.cat===storeFilter.cat)&&(storeFilter.rarity==="All"||x.rarity===storeFilter.rarity));
 if(storeFilter.sort==="Price: low to high")list.sort((a,b)=>a.price-b.price);
 if(storeFilter.sort==="Price: high to low")list.sort((a,b)=>b.price-a.price);
 return `${title("VEXA Store","First collection · permanent cosmetics")}
 <div class="panel row"><div><div class="small">YOUR BALANCE</div><div class="balance">${state.coins} VC</div></div><div class="spacer"></div><span class="pill cyan">Permanent ownership</span></div>
 <div class="filters">
 <select id="storeCat" onchange="updateStore()">${["All","Frames","Titles","Banners"].map(x=>`<option ${storeFilter.cat===x?"selected":""}>${x}</option>`).join("")}</select>
 <select id="storeRarity" onchange="updateStore()">${["All","Common","Rare","Epic","Legendary","Exclusive"].map(x=>`<option ${storeFilter.rarity===x?"selected":""}>${x}</option>`).join("")}</select>
 <select id="storeSort" onchange="updateStore()">${["Featured","Price: low to high","Price: high to low"].map(x=>`<option ${storeFilter.sort===x?"selected":""}>${x}</option>`).join("")}</select>
 </div>
 <div class="grid" id="storeItems">${storeCards(list)}</div>
 <p class="small">These are initial concept items; names, visuals and prices can still be revised before launch.</p>`;
}
function storeCards(list){
 if(!list.length)return `<div class="panel empty">No items match these filters.</div>`;
 return list.map(x=>{
 let owned=state.owned.includes(x.id);
 return `<div class="card"><div class="item-art">${x.art}</div>
 <div class="row" style="margin-top:10px"><span class="pill">${x.cat}</span><span class="pill">${x.rarity}</span></div>
 <h3>${x.name}</h3><p>Permanent cosmetic · ${owned?"Already owned":"One per category equipped"}</p>
 <div class="row"><span class="price">${x.price} VC</span><div class="spacer"></div><button onclick="previewItem('${x.id}')">Preview</button></div>
 ${owned?`<button class="ghost" style="width:100%;margin-top:8px" disabled>Owned</button>`:`<button class="primary" style="width:100%;margin-top:8px" onclick="buyItem('${x.id}')">Buy</button>`}
 </div>`;
 }).join("");
}
function updateStore(){
 storeFilter.cat=$("#storeCat").value;storeFilter.rarity=$("#storeRarity").value;storeFilter.sort=$("#storeSort").value;
 let list=cosmetics.filter(x=>(storeFilter.cat==="All"||x.cat===storeFilter.cat)&&(storeFilter.rarity==="All"||x.rarity===storeFilter.rarity));
 if(storeFilter.sort==="Price: low to high")list.sort((a,b)=>a.price-b.price);
 if(storeFilter.sort==="Price: high to low")list.sort((a,b)=>b.price-a.price);
 $("#storeItems").innerHTML=storeCards(list);
}
function previewItem(id){let x=cosmetics.find(i=>i.id===id);toast(`${x.name} · ${x.rarity} · ${x.price} VC`)}
function buyItem(id){
 let x=cosmetics.find(i=>i.id===id);
 if(state.owned.includes(id))return toast("Already owned — no duplicates.");
 if(state.coins<x.price)return toast("Not enough VC.");
 state.coins-=x.price;state.owned.push(id);
 state.notifications.unshift({id:Date.now(),type:"vc",text:`Purchased ${x.name}.`,read:false});
 save();render();toast(`${x.name} purchased.`);
}
function inventory(){
 let cats=["Frames","Titles","Banners"];
 let list=cosmetics.filter(x=>state.owned.includes(x.id)&&x.cat===inventoryTab);
 return `${title("My Inventory","Equip your permanent collection")}
 <div class="filters">${cats.map(c=>`<button class="${inventoryTab===c?"primary":""}" onclick="inventoryTab='${c}';render()">${c}</button>`).join("")}</div>
 ${list.length?`<div class="grid">${list.map(x=>`<div class="card"><div class="item-art">${x.art}</div><h3>${x.name}</h3><p>${x.rarity} · ${state.equipped[x.cat]===x.id?"Currently equipped":"Owned permanently"}</p><button class="${state.equipped[x.cat]===x.id?"":"primary"}" onclick="equip('${x.id}')">${state.equipped[x.cat]===x.id?"Equipped":"Equip"}</button></div>`).join("")}`:`<div class="panel empty"><div style="font-size:30px">▣</div><h3>Inventory empty</h3></div>`}`;
}
function equip(id){
 let x=cosmetics.find(i=>i.id===id);state.equipped[x.cat]=id;save();render();toast(`${x.name} equipped.`);
}

const missions=[
{id:"s1",type:"Daily",name:"Win streak",desc:"Reach a 2-win streak.",reward:50},
{id:"c1",type:"Daily",name:"Community check-in",desc:"Visit the VEXA community page.",reward:25},
{id:"s2",type:"Weekly",name:"Streak master",desc:"Reach a 5-win streak.",reward:150},
{id:"c2",type:"Weekly",name:"Community regular",desc:"Take part in a VEXA community event.",reward:100}
];
function missionsPage(){
 return `${title("Missions","Complete objectives and claim VC manually")}
 <div class="filters"><button class="${missionTab==="Daily"?"primary":""}" onclick="missionTab='Daily';render()">Daily</button><button class="${missionTab==="Weekly"?"primary":""}" onclick="missionTab='Weekly';render()">Weekly</button></div>
 <div class="grid">${missions.filter(m=>m.type===missionTab).map(m=>{
 let claimed=state.missionsClaimed.includes(m.id);
 return `<div class="card"><span class="pill red">${m.type}</span><h3>${m.name}</h3><p>${m.desc}</p>
 <div class="row"><span class="price">+${m.reward} VC</span><div class="spacer"></div><button ${claimed?"disabled":""} class="${claimed?"":"primary"}" onclick="claimMission('${m.id}')">${claimed?"Claimed":"Claim"}</button></div>
 <p class="small">Demo missions: completion is simulated.</p></div>`;
 }).join("")}</div>`;
}
function claimMission(id){
 let m=missions.find(x=>x.id===id);if(state.missionsClaimed.includes(id))return toast("Already claimed.");
 state.missionsClaimed.push(id);state.coins+=m.reward;
 state.notifications.unshift({id:Date.now(),type:"vc",text:`Claimed ${m.reward} VC from ${m.name}.`,read:false});
 save();render();toast(`+${m.reward} VC claimed.`);
}

function teams(){
 return `${title("VEXA Teams","Create a squad · Maximum 5 players")}
 <div class="panel"><h3>Create a team</h3><div class="filters">
 <input id="teamName" placeholder="Team name"><input id="teamTag" placeholder="TAG (optional)" maxlength="5">
 <select id="teamPrivacy"><option value="public">Public</option><option value="private">Private</option></select>
 <button class="primary" onclick="createTeam()">Create team</button></div>
 <p class="small">Demo teams are saved in this browser only. Shared membership requires a backend.</p></div>
 ${title("Your teams")}
 <div class="grid">${state.teams.length?state.teams.map((t,i)=>`<div class="card"><span class="pill">${t.private?"Private":"Public"}</span><h3>${esc(t.name)} <span class="muted">${esc(t.tag)}</span></h3><p>Captain: You · ${t.members.length}/5 members · Avg ELO ${state.elo}</p><div class="row"><button onclick="requestMember(${i})">Review requests</button><button onclick="renameTeam(${i})">Rename</button><button onclick="leaveTeam(${i})">Disband</button></div></div>`).join(""):`<div class="panel empty">You have not created a team yet.</div>`}</div>`;
}
function createTeam(){
 let n=$("#teamName").value.trim();if(!n)return toast("Enter a team name.");
 state.teams.push({name:n,tag:$("#teamTag").value.trim().toUpperCase(),private:$("#teamPrivacy").value==="private",members:["You"],requests:[]});
 save();render();toast("Team created in demo.");
}
function requestMember(i){
 let name=prompt("Demo: enter the name of the player requesting to join");if(!name)return;
 let t=state.teams[i];if(t.members.length>=5)return toast("Team is full.");
 if(!t.requests)t.requests=[];t.requests.push(name);
 if(confirm(`Accept ${name}'s request?`)){t.members.push(name);t.requests=t.requests.filter(x=>x!==name);save();render();toast("Request accepted.");}
 else{t.requests=t.requests.filter(x=>x!==name);save();render();toast("Request declined.");}
}
function renameTeam(i){let n=prompt("New team name",state.teams[i].name);if(n){state.teams[i].name=n;save();render();}}
function leaveTeam(i){if(confirm("Disband this team? Only the captain can do this.")){state.teams.splice(i,1);save();render();}}

function leaderboard(){
 return `${title("Clasificación","Jugadores ordenados por ELO")}
 <div class="panel"><div class="empty"><strong>Aún no hay resultados competitivos</strong>La clasificación se actualizará cuando se registren partidas.</div></div>`;
}
function filterPlayers(){
 let q=$("#playerSearch").value.toLowerCase();
 $$("#playersTable tbody tr").forEach(r=>r.classList.toggle("hide",!r.innerText.toLowerCase().includes(q)));
}

function friends(){
 return `${title("Friends","Your VEXA friends list")}
 <div class="panel"><h3>Add a friend</h3><div class="filters">
 <input id="friendName" placeholder="Competitive nickname"><button class="primary" onclick="addFriend()">Add friend</button></div>
 <p class="small">Friends in this prototype are saved only in this browser. Shared invites require a backend.</p></div>
 ${title("Your friends",`${state.friends.length} friends`)}
 <div class="grid">${state.friends.length?state.friends.map((f,i)=>`<div class="card"><div class="row">
 <div class="logo" style="border-color:${f.status==="online"?"#4ade80":"#555"};color:${f.status==="online"?"#4ade80":"#777"}">${esc(f.name.slice(0,1).toUpperCase())}</div>
 <div><h3>${esc(f.name)}</h3><span class="pill">${f.status==="online"?"● Online":"○ Offline"}</span></div><div class="spacer"></div></div>
 <p>${f.elo} ELO</p><div class="row"><button onclick="inviteFriend(${i})">Invite to custom</button><button class="ghost" onclick="removeFriend(${i})">Remove</button></div></div>`).join(""):`<div class="panel empty">Your friends list is empty.</div>`}</div>`;
}
function addFriend(){
 let name=$("#friendName").value.trim();if(!name)return toast("Enter a nickname.");
 if(state.friends.some(f=>f.name.toLowerCase()===name.toLowerCase()))return toast("Already on your friends list.");
 state.friends.push({name,status:"offline",elo:0});save();render();toast("Friend added in local demo.");
}
function removeFriend(i){state.friends.splice(i,1);save();render();}
function inviteFriend(i){toast("Demo invite prepared for "+state.friends[i].name+". Real invites require a backend.");}

function notifications(){
 let ns=state.notifications;
 return `${title("Notifications","Tournaments · Invites · VEXA Coins")}
 <div class="panel"><div class="row"><span class="pill red">${ns.filter(n=>!n.read).length} unread</span><div class="spacer"></div><button onclick="markAllRead()">Mark all as read</button></div>
 ${ns.length?ns.map(n=>`<div class="notification"><div class="row"><span class="pill">${n.type}</span>${n.read?"":'<span class="pill red">UNREAD</span>'}</div><p>${esc(n.text)}</p>${n.read?"":`<button onclick="markRead(${n.id})">Open / mark read</button>`}</div>`).join(""):`<div class="empty">No notifications yet.</div>`}</div>`;
}
function markRead(id){let n=state.notifications.find(x=>x.id===id);if(n)n.read=true;save();render();}
function markAllRead(){state.notifications.forEach(n=>n.read=true);save();render();}

function profile(){
 let r=getRank();
 return `${title("Player Profile","Competitive identity")}
 <div class="panel"><div class="row"><div class="rankicon" style="--rank:${r[4]}">${r[0]==="X"?"◇":"◆"}</div>
 <div><span class="pill red">${r[1]}</span><h2 style="margin:4px 0">${esc(state.username)}</h2><p class="muted">VEXA competitive player</p></div></div>
 <div class="stats"><div class="stat"><small>ELO</small><strong>${state.elo}</strong></div><div class="stat"><small>Wins</small><strong>${state.wins}</strong></div><div class="stat"><small>Losses</small><strong>${state.losses}</strong></div><div class="stat"><small>Win rate</small><strong>${state.wins+state.losses?Math.round(state.wins/(state.wins+state.losses)*100):0}%</strong></div></div>
 </div>
 ${title("Recent match history")}
 <div class="panel">${state.settings.history&&state.matchHistory.length?state.matchHistory.slice(0,20).map(m=>`<div class="notification">${esc(m)}</div>`).join(""):`<div class="empty">Your match history will appear here.</div>`}</div>`;
}

function settings(){
 return `${title("Settings","Personalize your VEXA experience")}
 <div class="panel"><h3>Privacy</h3>
 <label class="row"><input type="checkbox" ${state.settings.history?"checked":""} onchange="state.settings.history=this.checked;save()"> Show match history publicly</label>
 <label class="row"><input type="checkbox" ${state.settings.online?"checked":""} onchange="state.settings.online=this.checked;save()"> Show online status</label>
 <p class="small">Competitive stats (ELO, wins and win rate) remain public in this design.</p><hr style="border-color:var(--line)">
 <h3>Notifications</h3>${["tournaments","invites","vc"].map(k=>`<label class="row"><input type="checkbox" ${state.settings.notifications[k]?"checked":""} onchange="state.settings.notifications['${k}']=this.checked;save()"> ${k[0].toUpperCase()+k.slice(1)}</label>`).join("")}
 <hr style="border-color:var(--line)"><h3>Language</h3>
 <select onchange="state.settings.lang=this.value;save();toast('Language preference saved for prototype.')">
 <option value="en" ${state.settings.lang==="en"?"selected":""}>English</option><option value="es" ${state.settings.lang==="es"?"selected":""}>Español</option></select>
 <p class="small">The full interface translations are not implemented in this prototype; this saves the preference only.</p>
 <h3>Data</h3><button onclick="if(confirm('Reset all local demo data?')){localStorage.removeItem('vexa-demo-state');location.reload()}">Reset local demo</button></div>`;
}
window.vexaApp={setAccount(profile,stats){state.username=profile?.username||"VEXA Player";state.elo=Number(stats.elo)||0;state.coins=Number(stats.vc)||0;state.wins=Number(stats.wins)||0;state.losses=Number(stats.losses)||0;save();render();},showWelcomeBonus(){document.getElementById("welcomeBonus").classList.remove("hide");},hideWelcomeBonus(){document.getElementById("welcomeBonus").classList.add("hide");}};

function render(){
 let views={home,customs,friends,ranks:ranksPage,tournaments,store,inventory,missions:missionsPage,teams,leaderboard,notifications,profile,settings};
 $("#main").innerHTML=(views[page]||home)();save();
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$$("[data-page]").forEach(b=>b.addEventListener("click",()=>nav(b.dataset.page)));
$("#profileTop").addEventListener("click",()=>nav("profile"));
$("#bellBtn").addEventListener("click",()=>nav("notifications"));
$("#langBtn").addEventListener("click",()=>{state.settings.lang=state.settings.lang==="en"?"es":"en";save();toast("Language preference: "+state.settings.lang.toUpperCase()+" (interface translation not fully wired).")});
save();render();
</script><script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://fwzyybdavzfszpzzreht.supabase.co';
const SUPABASE_KEY = 'sb_publishable_UAet9BIl_Tli3VyzsMe_nQ_JsfgVXJj';

const loginScreen = document.getElementById('vexaLogin');
const loginButton = document.getElementById('discordLogin');
const status = document.getElementById('discordStatus');
const logoutButton = document.getElementById('logoutBtn');
const welcomeClose = document.getElementById('welcomeBonusClose');

if (!SUPABASE_URL.startsWith('https://') || !SUPABASE_KEY || SUPABASE_KEY.includes('PEGA_AQUI')) {
  status.textContent = 'No se pudo conectar con VEXA. Inténtalo más tarde.';
} else {
  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
  let loadedUserId = null;

  async function loadAccount(user) {
    if (!user || loadedUserId === user.id) return;
    status.textContent = 'Cargando tu perfil…';
    loginButton.disabled = true;

    const [profileResult, statsResult] = await Promise.all([
      supabase.from('profiles').select('username, avatar_url').eq('user_id', user.id).maybeSingle(),
      supabase.from('player_stats').select('elo, vc, wins, losses').eq('user_id', user.id).maybeSingle()
    ]);

    if (profileResult.error || statsResult.error || !profileResult.data || !statsResult.data) {
      status.textContent = 'No pudimos cargar tu perfil. Recarga la página para intentarlo de nuevo.';
      loginButton.disabled = false;
      return;
    }

    loadedUserId = user.id;
    window.vexaApp.setAccount(profileResult.data, statsResult.data);
    loginScreen.classList.add('hide');

    const createdAt = Date.parse(user.created_at || '');
    const isNewAccount = Number.isFinite(createdAt) && Date.now() >= createdAt && Date.now() - createdAt < 15 * 60 * 1000;
    const noticeKey = `vexa:welcome-bonus:${user.id}`;
    if (isNewAccount && Number(statsResult.data.vc) >= 100 && !localStorage.getItem(noticeKey)) {
      localStorage.setItem(noticeKey, 'shown');
      window.vexaApp.showWelcomeBonus();
    }
  }

  supabase.auth.onAuthStateChange((event, session) => {
    if (session?.user) {
      if (event === 'INITIAL_SESSION' || event === 'SIGNED_IN') {
        window.setTimeout(() => loadAccount(session.user), 0);
      }
    } else {
      loadedUserId = null;
      loginScreen.classList.remove('hide');
      status.textContent = '';
      loginButton.disabled = false;
    }
  });

  loginButton.addEventListener('click', async () => {
    loginButton.disabled = true;
    status.textContent = 'Conectando con Discord…';
    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'discord',
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
    if (error) {
      status.textContent = 'No se pudo iniciar sesión con Discord. Inténtalo de nuevo.';
      loginButton.disabled = false;
    }
  });

  logoutButton.addEventListener('click', async () => {
    logoutButton.disabled = true;
    const { error } = await supabase.auth.signOut();
    if (error) {
      logoutButton.disabled = false;
      window.alert('No se pudo cerrar la sesión. Inténtalo de nuevo.');
    }
  });

  welcomeClose.addEventListener('click', () => window.vexaApp.hideWelcomeBonus());
}
</script>
